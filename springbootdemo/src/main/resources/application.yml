server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: recruitment-website
  # 新增：数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruitment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 087920

# 新增：MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true    # 驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL日志输出
  global-config:
    db-config:
      id-type: auto                        # 主键自增

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: recruitment-website
  # 新增：数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruitment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 087920

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:          # 如果Redis设置了密码，在此填写
      database: 0        # 使用的数据库索引，默认0
      timeout: 10000     # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8  # 连接池最大连接数
          max-idle: 8    # 连接池最大空闲连接数
          min-idle: 0    # 连接池最小空闲连接数
          max-wait: -1   # 连接池最大阻塞等待时间（-1表示无限制）

# 新增：MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true    # 驼峰命名转换
    call-setters-on-nulls: true           # 查询结果为 Map 时保留 null 字段（如 cancelTime）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL日志输出
  global-config:
    db-config:
      id-type: auto                        # 主键自增

# JWT配置
jwt:
  secret: recruitment-website-jwt-secret-key-2024-web-architecture-course
  expiration: 604800000  # 7天（毫秒）
